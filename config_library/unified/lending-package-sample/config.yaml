  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Closing-Disclosure
    type: object
    x-aws-idp-document-type: Closing-Disclosure
    description: >-
      A standardized five-page form (TRID/TILA-RESPA) provided to borrowers at
      least three business days before closing a mortgage loan, detailing the
      final loan terms, projected payments, closing costs, and summaries of
      transactions between borrower and seller.
    $defs:
      Address:
        type: object
        description: A street address with city, state, and zip code.
        properties:
          streetAddress:
            type: string
            description: The street address line.
            x-aws-idp-evaluation-method: EXACT
          city:
            type: string
            description: The city name.
            x-aws-idp-evaluation-method: EXACT
          stateCode:
            type: string
            description: The two-letter state abbreviation.
            x-aws-idp-evaluation-method: EXACT
          zipCode:
            type: string
            description: The postal zip code.
            x-aws-idp-evaluation-method: EXACT
      NamedParty:
        type: object
        description: A named party in the transaction with their address.
        properties:
          fullName:
            type: string
            description: The full name of the party.
            x-aws-idp-evaluation-method: EXACT
          address:
            description: The address of the party.
            $ref: "#/$defs/Address"
            x-aws-idp-evaluation-method: LLM
      LenderParty:
        type: object
        description: The lending institution information.
        properties:
          name:
            type: string
            description: The name of the lending institution.
            x-aws-idp-evaluation-method: EXACT
          address:
            description: The address of the lender.
            $ref: "#/$defs/Address"
            x-aws-idp-evaluation-method: LLM
      YearsPayment:
        type: object
        description: Projected payment breakdown for a year range.
        properties:
          principalAndInterest:
