          SuffixName:
            type: string
            x-aws-idp-evaluation-method: EXACT
          LastName:
            type: string
            x-aws-idp-evaluation-method: EXACT
          MiddleName:
            type: string
            x-aws-idp-evaluation-method: EXACT
          FirstName:
            type: string
