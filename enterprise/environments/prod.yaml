# IDP Production Environment
# Sync to S3: aws s3 cp enterprise/environments/prod.yaml s3://<prod-source-bucket>/deploy/pipeline-config.yaml

stack_name: idp-prod
region: us-east-1
admin_email: admin@example.com
skip_tests: true

# CloudFormation service role (pre-deployed by customer's cloud team)
# If omitted, the pipeline creates one automatically from IDP-Cloudformation-Service-Role.yaml
# role_arn: arn:aws:iam::123456789012:role/idp-prod-iam-CFServiceRole

parameters:
  # --- Hosting ---
  # v0.6.1 removed the ALB option; APIGateway is the private-network mode.
  WebUIHosting: APIGateway

  # --- Private networking ---
  ApiGatewayVisibility: PRIVATE
  ApiGatewayVpcEndpointId: ""   # fill with prod execute-api VPC endpoint
  LambdaSubnetIds: ""           # fill with prod private subnet IDs
  DeployInVPC: "true"
  VpcId: ""                     # fill with prod VPC ID
  PrivateSubnetIds: ""          # fill with prod private subnet IDs
  LambdaSecurityGroupId: ""     # fill with prod Lambda SG

  # --- Headless API (Jobs API + Ping auth) ---
  EnableHeadless: "true"
  PingIssuer1: ""           # fill with prod Ping issuer
  PingJwksUri1: ""          # fill with prod Ping JWKS endpoint
  PingIssuer2: ""           # optional secondary issuer
  PingJwksUri2: ""
  PingRequiredRoles: ""     # comma-separated required roles

  # --- Completion hook (Amazon MQ for ActiveMQ, STOMP over TLS) ---
  EnableCompletionHook: "true"
  CompletionHookMQHost: ""          # fill with prod ActiveMQ broker hostname
  CompletionHookMQPort: "61617"
  CompletionHookMQDestination: "/queue/idp.document.completed"
  CompletionHookPingTokenUrl: ""    # fill with prod Ping token endpoint
  CompletionHookPingClientId: ""
  CompletionHookPingClientSecretArn: ""  # fill with prod Secrets Manager ARN
  CompletionHookPingScope: ""

  # --- Private registry ---
  # DockerConfigSecretArn: ""
  # UvConfigSecretArn: ""
  # PipConfigSecretArn: ""
  # NpmConfigSecretArn: ""

  # --- Build ---
  LambdaArchitecture: x86_64  # x86_64 avoids QEMU cross-compile in CodeBuild

  # --- Security ---
  PermissionsBoundaryArn: ""  # fill with customer's boundary ARN (applied to all stack-created roles)

  # --- Other ---
  EnableMCP: "false"
  DocumentKnowledgeBase: DISABLED
  ArtifactsBucketKmsKeyArn: ""  # fill if S3 bucket uses KMS
