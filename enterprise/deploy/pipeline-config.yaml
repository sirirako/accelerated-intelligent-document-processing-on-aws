# Pipeline deployment configuration
# This file is read by codebuild_deployment.py to configure the IDP stack deployment.
# Place alongside code.zip or include in the project root under deploy/.

admin_email: siriratk@amazon.com
stack_name: aidp-cd-test
skip_tests: true

# Build Lambda containers for x86_64 (CodeBuild is x86_64, avoids QEMU cross-compile)
parameters:
  LambdaArchitecture: x86_64

# Optional: deploy headless — no UI/AppSync/Cognito/WAF (default: false)
# headless: false

# CloudFormation parameters passed to idp-cli deploy --parameters
# Any parameter accepted by the main template.yaml can go here.
# parameters:
#   # VPC / Networking
#   ALBVpcId: vpc-0abc123
#   ALBSubnetIds: subnet-aaa,subnet-bbb
#   LambdaSubnetIds: subnet-aaa,subnet-bbb
#   AppSyncVisibility: PRIVATE
#
#   # External Identity Provider
#   ExternalIdPType: OIDC
#   ExternalIdPName: PingFederate
#   ExternalIdPOIDCIssuer: https://sso.customer.com
#   ExternalIdPOIDCClientId: idp-app-client
#
#   # Security
#   PermissionsBoundaryArn: arn:aws:iam::123456789012:policy/boundary
#   WAFAllowedIPv4Ranges: 10.0.0.0/8
#
#   # Private registry (build-time — alternative to CodeBuild-level secrets)
#   DockerConfigSecretArn: arn:aws:secretsmanager:...
#   UvConfigSecretArn: arn:aws:secretsmanager:...
#   PipConfigSecretArn: arn:aws:secretsmanager:...
#   NpmConfigSecretArn: arn:aws:secretsmanager:...
#   CACertBundleS3Uri: s3://bucket/certs/ca-bundle.tar.gz
