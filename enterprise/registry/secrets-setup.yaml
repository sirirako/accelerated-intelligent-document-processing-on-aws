AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Create Secrets Manager secrets for IDP private registry configuration.
  Deploy this stack once, then pass the secret ARNs to the IDP stack.

Parameters:
  PipConfig:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Contents of pip.conf for accessing private PyPI registry.
      Example: [global]\nindex-url = https://user:token@jfrog.company.com/artifactory/api/pypi/pypi-virtual/simple

  UvConfig:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Contents of uv.toml for accessing private Python package repository.
      Example: index-url = "https://user:token@jfrog.company.com/artifactory/api/pypi/pypi-virtual/simple"

  NpmConfig:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Contents of .npmrc for accessing private npm registry.
      Example: registry=https://jfrog.company.com/artifactory/api/npm/npm-virtual/\n//jfrog.company.com/:_authToken=TOKEN

  DockerConfig:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Contents of Docker config.json for authenticating to private Docker registries.
      Example: {"auths":{"jfrog.company.com":{"auth":"base64-encoded-user:token"}}}

Conditions:
  HasPipConfig: !Not [!Equals [!Ref PipConfig, ""]]
  HasUvConfig: !Not [!Equals [!Ref UvConfig, ""]]
  HasNpmConfig: !Not [!Equals [!Ref NpmConfig, ""]]
  HasDockerConfig: !Not [!Equals [!Ref DockerConfig, ""]]

Resources:
  PipConfigSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasPipConfig
    Properties:
      Name: !Sub "${AWS::StackName}/registry/pip"
      Description: "PIP configuration for IDP private registry access"
      SecretString: !Ref PipConfig

  UvConfigSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasUvConfig
    Properties:
      Name: !Sub "${AWS::StackName}/registry/uv"
      Description: "UV configuration for IDP private registry access"
      SecretString: !Ref UvConfig

  NpmConfigSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasNpmConfig
    Properties:
      Name: !Sub "${AWS::StackName}/registry/npm"
      Description: "NPM configuration for IDP private registry access"
      SecretString: !Ref NpmConfig

  DockerConfigSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasDockerConfig
    Properties:
      Name: !Sub "${AWS::StackName}/registry/docker"
      Description: "Docker configuration for IDP private registry access"
      SecretString: !Ref DockerConfig

Outputs:
  PipConfigSecretArn:
    Condition: HasPipConfig
    Value: !Ref PipConfigSecret
    Description: "ARN of the PIP config secret — pass as PipConfigSecretArn to IDP stack"

  UvConfigSecretArn:
    Condition: HasUvConfig
    Value: !Ref UvConfigSecret
    Description: "ARN of the UV config secret — pass as UvConfigSecretArn to IDP stack"

  NpmConfigSecretArn:
    Condition: HasNpmConfig
    Value: !Ref NpmConfigSecret
    Description: "ARN of the NPM config secret — pass as NpmConfigSecretArn to IDP stack"

  DockerConfigSecretArn:
    Condition: HasDockerConfig
    Value: !Ref DockerConfigSecret
    Description: "ARN of the Docker config secret — pass as DockerConfigSecretArn to IDP stack"
